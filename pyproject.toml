[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-open"
version = "0.1.0"
description = "Open prototype: recurrence, trend and cost-of-quality analytics for pharmaceutical quality records (synthetic data)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Ayodeji Ola" }]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
qa-open = "qa_open.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
